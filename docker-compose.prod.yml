# Nkuku Companion — Production Docker Compose
# Deploy: docker compose -f docker-compose.prod.yml up --build -d
#
# Requirements:
#   - .env file present in project root (see .env.example)
#   - ISPConfig nginx (or any reverse proxy) handles SSL on port 80/443
#   - Docker containers bind to localhost only for security

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nkuku_db
      POSTGRES_USER: nkuku_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nkuku_user -d nkuku_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nkuku_internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nkuku_internal
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      BULK_RATE_LIMIT: ${BULK_RATE_LIMIT:-10}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: 3001
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-https://ntfy.zeendeefood.solutions}
      NTFY_DEFAULT_TOPIC: ${NTFY_DEFAULT_TOPIC:-nkuku-alerts}
      NTFY_AUTH_TOKEN: ${NTFY_AUTH_TOKEN:-}
      # ── S3 / MinIO object storage ──
      S3_ENDPOINT: ${S3_ENDPOINT:-http://pom-minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-nkuku-documents}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # ── ClamAV virus scanning ──
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      REQUIRE_VIRUS_SCAN: ${REQUIRE_VIRUS_SCAN:-true}
      # ── Document attachments limits ──
      MAX_ATTACHMENTS_PER_TX: ${MAX_ATTACHMENTS_PER_TX:-20}
      # ── Flutterwave (Payments / Billing) ──
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY}
      FLUTTERWAVE_PUBLIC_KEY: ${FLUTTERWAVE_PUBLIC_KEY}
      FLUTTERWAVE_WEBHOOK_HASH: ${FLUTTERWAVE_WEBHOOK_HASH}
      # ── Email (SMTP) ──
      EMAIL_DISABLED: ${EMAIL_DISABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Nkuku Companion <no-reply@nkuku.app>}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:30000}
    # Bind to localhost only — ISPConfig nginx proxies in from the outside
    ports:
      - "127.0.0.1:30001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    networks:
      - nkuku_internal
      - nkuku_public
      - shared-net
    restart: unless-stopped
    # Migrations are real (P-2 baseline). Seed is NOT run on boot — seed
    # manually when needed: docker compose exec api npx prisma db seed
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        # Inlined into the client bundle at build time. Set to "false"
        # for white-label/self-hosted deployments ("/" → /login).
        NEXT_PUBLIC_MARKETING_ENABLED: ${NEXT_PUBLIC_MARKETING_ENABLED:-true}
    environment:
      NODE_ENV: production
      # Empty = same-origin API calls (nginx routes /api to backend)
      NEXT_PUBLIC_API_URL: ""
    # Bind to localhost only — ISPConfig nginx proxies in from the outside
    ports:
      - "127.0.0.1:30000:3000"
    depends_on:
      - api
    networks:
      - nkuku_public
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: ["serve"]
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-https://ntfy.zeendeefood.solutions}
      NTFY_CACHE_FILE: "/var/cache/ntfy/cache.db"
      NTFY_ATTACHMENT_CACHE_DIR: "/var/cache/ntfy/attachments"
      # Access control: deny everything by default; anonymous read is granted
      # per-topic via `ntfy access` and the API publishes with a bearer token.
      NTFY_AUTH_FILE: "/var/cache/ntfy/auth.db"
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
    volumes:
      - ntfy_data:/var/cache/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Bind to localhost only — ISPConfig nginx proxies in from the outside
    ports:
      - "127.0.0.1:30085:80"
    networks:
      - nkuku_public
    restart: unless-stopped

  # ─── MinIO (self-contained deployments only) ────────────
  # Prod currently uses the shared pom-minio host (S3_ENDPOINT env). For a
  # standalone/self-contained deploy, start with:
  #   docker compose -f docker-compose.prod.yml --profile self-contained up -d
  # and set S3_ENDPOINT=http://minio:9000 in .env. The bundled postgres in
  # this file covers the DB likewise (DATABASE_URL → postgres:5432).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-40-07Z
    profiles: ["self-contained"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:30090:9000"
    networks:
      - nkuku_internal
    restart: unless-stopped

  # ─── ClamAV (virus scanning for document uploads) ────────
  clamav:
    image: clamav/clamav-debian@sha256:741e6c447241220e0792a901befcaec1d55a755c5097fc9cd88d7fd8be251a5c
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    ports:
      - "127.0.0.1:3310:3310"
    networks:
      - nkuku_internal
      - shared-net
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  postgres_data:
  redis_data:
  ntfy_data:
  clamav_data:
  minio_data:

networks:
  nkuku_internal:
  nkuku_public:
  shared-net:
    external: true
