# ============================================================
# admin.nkuku.zeendeefood.solutions — platform staff console (P2)
#
# DEPLOYED AS: /etc/nginx/conf.d/admin-nkuku.conf (custom vhost, NOT
# ISPConfig-managed) + certbot DNS-01 via the box's existing
# dns-godaddy credentials (/etc/letsencrypt/secrets/godaddy.ini) —
# cert auto-renews via the certbot timer. DNS A record `admin.nkuku`
# → server IP was created via the GoDaddy API.
#
# This file remains as reference for reproducing the site (e.g. on a
# new host or inside ISPConfig): serve the Next.js app on
# 127.0.0.1:30030 with these headers. No /api proxy by design — the
# console calls https://nkuku.zeendeefood.solutions/api/... cross-origin
# (allowed via CORS_ORIGINS). Defense in depth stays at the API:
# staff JWT + TOTP + PLATFORM_ALLOWED_CIDRS.
# ============================================================

# ── Security headers (apply to every response) ──
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# App Router inline hydration needs 'unsafe-inline' scripts; connect-src
# must reach the API host for cross-origin platform calls.
add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://nkuku.zeendeefood.solutions; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

# ── Proxy timeouts ─────────────────────────
proxy_connect_timeout       600s;
proxy_send_timeout          600s;
proxy_read_timeout          600s;
send_timeout                600s;

# ── Next.js static assets (cache aggressively) ──
location /_next/static {
    proxy_pass         http://127.0.0.1:30030;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_cache_valid  200 365d;
    add_header         Cache-Control "public, max-age=31536000, immutable";
}

# ── Everything else → admin-web ──
location / {
    proxy_pass         http://127.0.0.1:30030;
    proxy_http_version 1.1;

    proxy_set_header   Host               $host;
    proxy_set_header   X-Real-IP          $remote_addr;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto  $scheme;
    proxy_set_header   Connection         "";

    proxy_buffering    off;
    proxy_cache        off;
}
