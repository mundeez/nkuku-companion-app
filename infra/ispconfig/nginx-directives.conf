# ============================================================
# ISPConfig Nginx Directives for nkuku.zeendeefood.solutions
# Paste into: Sites > nkuku.zeendeefood.solutions > Options > nginx Directives
# ============================================================

# ── Security headers (apply to every response) ──
# NOTE: a location that declares its own add_header inherits NONE of these,
# so they are repeated inside /_next/static below.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# App Router serves inline hydration scripts, so script-src needs
# 'unsafe-inline'; upgrade to nonces later if the app changes.
add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

# ── Proxy timeouts ─────────────────────────
proxy_connect_timeout       600s;
proxy_send_timeout          600s;
proxy_read_timeout          600s;
send_timeout                600s;

# ── API routes (must come BEFORE the catch-all location / ) ──
# NOTE: `upstream` blocks are illegal inside ISPConfig's server-context
# directives, so proxy_pass targets the loopback ports directly.
location /api {
    proxy_pass         http://127.0.0.1:30001;
    proxy_http_version 1.1;

    proxy_set_header   Host               $host;
    proxy_set_header   X-Real-IP          $remote_addr;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto  $scheme;
    proxy_set_header   Connection         "";

    # WebSocket support (for future real-time features)
    proxy_set_header   Upgrade            $http_upgrade;
    proxy_set_header   Connection         "upgrade";

    # Buffer settings for API responses
    proxy_buffering    off;
    proxy_cache        off;
}

# ── Next.js static assets (cache aggressively) ──
location /_next/static {
    proxy_pass         http://127.0.0.1:30000;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

    expires            365d;
    add_header         Cache-Control "public, immutable";

    # Security headers repeated — this location's Cache-Control add_header
    # suppresses the server-level add_header inheritance above.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
}

# ── Web app (Next.js) ──────────────────────
location / {
    proxy_pass         http://127.0.0.1:30000;
    proxy_http_version 1.1;

    proxy_set_header   Host               $host;
    proxy_set_header   X-Real-IP          $remote_addr;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto  $scheme;
    proxy_set_header   Connection         "";

    # WebSocket support for Next.js HMR / dev mode
    proxy_set_header   Upgrade            $http_upgrade;
    proxy_set_header   Connection         "upgrade";
}
