events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Docker's embedded DNS resolver — allows nginx to start even if
  # upstream containers aren't ready yet, and re-resolves periodically.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name localhost;

    # /health → backend health check (not under /api prefix)
    location /health {
      set $api_upstream http://api:3001;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # /api → backend API (variable-based proxy_pass so nginx doesn't
    # resolve the upstream at startup, only at request time)
    location /api {
      set $api_upstream http://api:3001;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # / → web frontend
    location / {
      set $web_upstream http://web:3000;
      proxy_pass $web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
