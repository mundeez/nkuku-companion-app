services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://nkuku_user:dev_password_change_me@shared-postgres:5432/nkuku_db}
      REDIS_URL: ${REDIS_URL:-redis://shared-redis:6379}
      PORT: ${API_PORT:-3001}
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_min_64_chars_long_for_dev_only}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@nkuku.local}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-change_me}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://ntfy}
      NTFY_DEFAULT_TOPIC: ${NTFY_DEFAULT_TOPIC:-nkuku-alerts}
    volumes:
      - ./apps/api/src:/app/src:ro
      - ./apps/api/prisma:/app/prisma:ro
      - ./apps/api/tests:/app/tests:ro
      - ./apps/api/vitest.config.ts:/app/vitest.config.ts:ro
      - api_node_modules:/app/node_modules
    ports:
      - "30001:3001"
    networks:
      - shared-net
      - nkuku_public
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && pnpm run dev"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "30000:3000"
    networks:
      - nkuku_public
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "30080:80"
    depends_on:
      - api
      - web
    networks:
      - nkuku_public
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: ["serve"]
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:30085}
      NTFY_CACHE_FILE: "/var/cache/ntfy/cache.db"
      NTFY_ATTACHMENT_CACHE_DIR: "/var/cache/ntfy/attachments"
    volumes:
      - ntfy_data:/var/cache/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "30085:80"
    networks:
      - nkuku_public
    restart: unless-stopped

volumes:
  api_node_modules:
  ntfy_data:

networks:
  shared-net:
    external: true
  nkuku_public:
