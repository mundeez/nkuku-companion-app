name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: true

jobs:
  api:
    name: API (lint, typecheck, unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nkuku_user
          POSTGRES_PASSWORD: dev_password_change_me
          POSTGRES_DB: nkuku_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nkuku_user -d nkuku_db"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # MinIO runs from a step, not `services:` — the services block can't set
      # the container CMD and the official image needs `server /data`.
      - name: Start MinIO (S3 for document tests)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci-minio-secret \
            minio/minio:RELEASE.2025-04-22T22-40-07Z server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/ready && break || sleep 1; done
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate + migrate (schema + SQL extras)
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://nkuku_user:dev_password_change_me@localhost:5432/nkuku_db
      - name: Lint
        working-directory: apps/api
        run: pnpm run lint
      - name: Typecheck
        working-directory: apps/api
        run: pnpm run typecheck
      - name: Unit tests
        working-directory: apps/api
        run: pnpm run test:unit
        env:
          DATABASE_URL: postgresql://nkuku_user:dev_password_change_me@localhost:5432/nkuku_db
      - name: Seed + start API for integration tests
        working-directory: apps/api
        run: |
          npx prisma db seed
          DATABASE_URL="$DATABASE_URL" AUTH_RATE_LIMIT=0 BULK_RATE_LIMIT=0 TEST_MODE=true EMAIL_DISABLED=true \
            JWT_SECRET=ci-test-secret REDIS_URL=redis://localhost:6379 \
            S3_ENDPOINT=http://localhost:9000 S3_ACCESS_KEY=ci-minio S3_SECRET_KEY=ci-minio-secret \
            S3_BUCKET=nkuku-documents S3_REGION=us-east-1 REQUIRE_VIRUS_SCAN=false \
            npx tsx src/main.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3001/health && break || sleep 2; done
          curl -sf http://localhost:3001/health || { echo "API failed to start"; cat /tmp/api.log; exit 1; }
        env:
          DATABASE_URL: postgresql://nkuku_user:dev_password_change_me@localhost:5432/nkuku_db
      - name: Integration tests
        working-directory: apps/api
        run: pnpm run test:integration
        env:
          DATABASE_URL: postgresql://nkuku_user:dev_password_change_me@localhost:5432/nkuku_db
          TEST_MODE: "true"
      - name: API server log (on failure)
        if: failure()
        run: tail -n 300 /tmp/api.log

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: apps/web
        run: pnpm run lint
      - name: Typecheck
        working-directory: apps/web
        run: pnpm run typecheck
      - name: Build
        working-directory: apps/web
        run: pnpm run build

  mobile:
    name: Mobile (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        working-directory: apps/mobile
        run: flutter test
