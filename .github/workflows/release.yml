name: Release

# Builds a signed Android App Bundle (AAB) + release APK on every `v*` tag
# and attaches them to the GitHub release. An unsigned iOS build verifies the
# app compiles for App Store submission (signing needs a paid Apple account —
# see docs/STORE-LAUNCH.md).
#
# Required repository secrets for the signed AAB:
#   ANDROID_KEYSTORE_BASE64 — base64 of android/release.keystore
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD — from android/key.properties
# If the keystore secret is absent the job still builds an unsigned APK.

on:
  push:
    tags: ["v*"]

env:
  APP_API_BASE_URL: https://nkuku.zeendeefood.solutions
  # Stores want a bare numeric version (iOS rejects "1.43.0-alpha"); strip
  # the leading "v" and any pre-release suffix from the tag.
  BUILD_NAME: ${{ github.ref_name }}

permissions:
  contents: write

jobs:
  android:
    name: Android AAB + APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive numeric build name from tag
        run: echo "BUILD_NAME=$(echo '${{ github.ref_name }}' | sed -E 's/^v//; s/-.*$//')" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Restore signing config (if secrets present)
        working-directory: apps/mobile
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
            cat > android/key.properties <<EOF
          storeFile=../release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::Keystore secrets not set — building unsigned APK only."
          fi

      - name: Build signed AAB
        if: env.SIGNED == 'true'
        working-directory: apps/mobile
        run: >
          flutter build appbundle --release
          --build-name=${{ env.BUILD_NAME }} --build-number=${{ github.run_number }}
          --dart-define=APP_API_BASE_URL=${{ env.APP_API_BASE_URL }}

      - name: Build release APK
        working-directory: apps/mobile
        run: >
          flutter build apk --release
          --build-name=${{ env.BUILD_NAME }} --build-number=${{ github.run_number }}
          --dart-define=APP_API_BASE_URL=${{ env.APP_API_BASE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.ref_name }}
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: Attach artifacts to GitHub release
        run: |
          # The tag push triggers this before the release may exist — create it if needed.
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" --clobber \
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk#nkuku-${{ github.ref_name }}.apk \
            || true
          if [ -f apps/mobile/build/app/outputs/bundle/release/app-release.aab ]; then
            gh release upload "${{ github.ref_name }}" --clobber \
              apps/mobile/build/app/outputs/bundle/release/app-release.aab#nkuku-${{ github.ref_name }}.aab
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: iOS build check (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Derive numeric build name from tag
        run: echo "BUILD_NAME=$(echo '${{ github.ref_name }}' | sed -E 's/^v//; s/-.*$//')" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get
      - name: Build iOS (no codesign)
        working-directory: apps/mobile
        run: >
          flutter build ios --release --no-codesign
          --build-name=${{ env.BUILD_NAME }} --build-number=${{ github.run_number }}
          --dart-define=APP_API_BASE_URL=${{ env.APP_API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ github.ref_name }}
          path: apps/mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: warn
