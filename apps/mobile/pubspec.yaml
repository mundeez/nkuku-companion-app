name: nkuku_mobile
description: Nkuku Companion — broiler chicken production management
publish_to: 'none'
version: 1.17.0-alpha

# Note: drift / sqlite3_flutter_libs are pinned for future M3-7 Offline Sync.
# Do not upgrade without testing offline sync migrations.

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  shared_preferences: ^2.3.0
  intl: ^0.19.0
  fl_chart: ^0.69.0
  drift: 2.21.0
  sqlite3_flutter_libs: 0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  share_plus: ^13.2.0
  file_picker: ">=12.0.0-beta.1"
  flutter_secure_storage: ^11.0.0
  # Social login
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^6.0.4
  sign_in_with_apple: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: 2.21.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon_1024.png"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/app_icon_1024.png"
  web:
    generate: true
    image_path: "assets/app_icon_1024.png"
    background_color: "#1B5E20"
    theme_color: "#1B5E20"

# Native splash screen, matching the brand seed color used in
# lib/theme/app_theme.dart and the launcher icon background above.
# Regenerate after changing: `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#1B5E20"
  color_dark: "#0D3813"
  image: "assets/app_icon_1024.png"
  android_12:
    color: "#1B5E20"
    color_dark: "#0D3813"
    image: "assets/app_icon_1024.png"
  android: true
  ios: true
  web: false
